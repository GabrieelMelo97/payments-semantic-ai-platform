      governed Semantic Layer queries (zero raw LLM SQL).
    depends_on:
      - ref('fct_payments')
      - ref('dim_merchants')
    owner:
      name: "Analytics Engineering & Risk"
      email: "analytics-engineering@fintech-payments.example"

  - name: executive_payments_dashboard
