    maturity: high
    description: "Interactive KPI dashboard for Finance, Product, and Fraud Risk leadership."
    depends_on:
      - ref('fct_payments')
      - ref('fct_daily_payment_metrics')
      - ref('dim_merchants')
    owner:
      name: "Finance & Risk Leadership"
      email: "finance-risk@fintech-payments.example"
