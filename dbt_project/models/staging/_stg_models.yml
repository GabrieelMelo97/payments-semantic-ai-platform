version: 2

models:
  - name: stg_merchants
    description: "Cleaned 1:1 view of current merchant attributes."
    columns:
      - name: merchant_id
        tests: [not_null, unique]
      - name: region
        tests:
          - not_null
          - accepted_values:
              values: ["Sudeste", "Sul", "Nordeste", "Centro-Oeste", "Norte"]
      - name: merchant_tier
        tests:
          - not_null
          - accepted_values:
              values: ["SMB", "Mid-Market", "Enterprise"]

  - name: stg_merchant_mdr_history
    description: "SCD Type 2 validity intervals (valid_from, valid_to) for merchant MDR and interchange rates."
    columns:
      - name: merchant_id
        tests: [not_null]
      - name: valid_from
        tests: [not_null]

  - name: stg_transactions
    description: "Deduplicated and standardized payment transactions."
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ["approved", "declined", "refunded"]

  - name: stg_chargebacks
    description: "Cleaned chargeback disputes linked to transactions."
    columns:
      - name: chargeback_id
        tests: [not_null, unique]
      - name: dispute_status
        tests:
          - not_null
          - accepted_values:
              values: ["lost", "won", "under_review"]
