version: 2

sources:
  - name: payments_raw
    description: "Validated raw FinTech payment tables loaded after Pandera Data Contract quarantine."
    schema: "{{ 'payments_raw' if target.type == 'bigquery' else 'raw' }}"
    tables:
      - name: raw_merchants
        description: "Current state of merchant master records."
        columns:
          - name: merchant_id
            tests: [not_null, unique]
      - name: raw_merchants_history
        description: "Historical merchant MDR & interchange fee versions for SCD Type 2 pricing attribution."
      - name: raw_transactions
        description: "Contract-validated raw payment attempts (may contain upstream duplicates)."
        loaded_at_field: created_at
        freshness:
          warn_after: { count: 72, period: hour }
        columns:
          - name: transaction_id
            tests: [not_null]
      - name: raw_chargebacks
        description: "Late-arriving chargeback disputes."
        columns:
          - name: chargeback_id
            tests: [not_null, unique]
