[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payments-semantic-ai-platform"
version = "1.0.0"
description = "End-to-end FinTech Payments Analytics Engineering Platform with Governed Semantic Layer (dbt + MetricFlow), Gemini AI Copilot, and GCP Terraform IaC."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gabriel Melo" }]

dependencies = [
    "duckdb>=1.1.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pyarrow>=17.0.0,<20.0.0",
    "pandera>=0.20.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "streamlit>=1.39.0,<2.0.0",
    "plotly>=5.24.0,<6.0.0",
    "typer>=0.12.5,<1.0.0",
    "dbt-core>=1.8.7,<1.10.0",
    "dbt-duckdb>=1.8.4,<1.10.0",
]

[project.optional-dependencies]
gcp = [
    "dbt-bigquery>=1.8.3,<1.10.0",
    "google-cloud-bigquery>=3.25.0,<4.0.0",
    "google-cloud-storage>=2.18.0,<3.0.0",
    "google-genai>=0.8.0,<2.0.0",
]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.7.0,<1.0.0",
    "sqlfluff>=3.2.0,<4.0.0",
    "sqlfluff-templater-dbt>=3.2.0,<4.0.0",
]

[project.scripts]
payments-cli = "payments_platform.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/payments_platform"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
